name: Fantasy Football Data Refresh

on:
  schedule:
    # Run at 3 PM UTC (8 AM Mountain Time) on:
    # Tuesday (after MNF), Thursday (after TNF), Sunday (morning before games)
    - cron: '0 15 * * 2'
    - cron: '0 15 * * 4'
    - cron: '0 15 * * 0'
  workflow_dispatch: {}  # Manual trigger button

permissions:
  contents: write   # Required for committing data and deploying to Pages
  pages: write      # Required for GitHub Pages deployment
  id-token: write   # Required for Pages deployment

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate demo data
        run: python -m src.dashboard.generate_demo

      - name: Run pipeline
        run: python -m src.main --demo
        env:
          DEMO_MODE: 'true'

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/demo/league_data.json
          git commit -m "Auto-refresh: $(date -u +%Y-%m-%d) Week data update" || echo "No changes to commit"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
